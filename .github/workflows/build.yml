name: Build Ezkiel Notch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Ezkiel Notch App
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh
          
      - name: Create Zip Archive
        run: |
          find . -name "EzkielNotch.app" -type d -exec zip -r EzkielNotch-Intel-AppleSilicon.zip {} +
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EzkielNotch-Build
          path: EzkielNotch-Intel-AppleSilicon.zip
